<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Events Hub | IIT Roorkee</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary: #f4b400; /* IITR Gold */
            --accent-blue: #38bdf8;
            --accent-purple: #818cf8;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); margin: 0; overflow-x: hidden; }

        /* Navigation */
        nav { 
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
            padding: 1rem 5%; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 1px solid #334155;
            position: sticky; top: 0; z-index: 100;
        }
       .logo { font-weight: 800; font-size: 1.5rem; color: var(--primary); letter-spacing: -1px; }
       .nav-btn { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 0.5rem 1.2rem; border-radius: 6px; cursor: pointer; transition: 0.3s; }
       .nav-btn:hover { background: var(--primary); color: var(--bg-dark); }

        /* Main Container */
       .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }

        /* Login Screen */
        #login-screen { height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
       .login-card { background: var(--card-bg); padding: 3rem; border-radius: 16px; border: 1px solid #334155; width: 100%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
       .input-group { text-align: left; margin-bottom: 1.5rem; }
       .input-group label { display: block; margin-bottom: 0.5rem; color: var(--text-dim); font-size: 0.9rem; }
        input { width: 100%; padding: 0.8rem; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; }

        /* Dashboard */
       .header-section { margin-bottom: 3rem; }
       .header-section h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
       .header-section p { color: var(--text-dim); }

       .event-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; }
       .event-card { 
            background: var(--card-bg); border-radius: 12px; border: 1px solid #334155; 
            overflow: hidden; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer; position: relative;
        }
       .event-card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 10px 30px rgba(244, 180, 0, 0.1); }
       .card-img { height: 160px; background: linear-gradient(45deg, #1e293b, #334155); display: flex; align-items: center; justify-content: center; font-size: 3rem; }
       .card-content { padding: 1.5rem; }
       .tag { font-size: 0.7rem; text-transform: uppercase; font-weight: 800; color: var(--primary); margin-bottom: 0.5rem; display: inline-block; }
       .card-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem; }
       .card-meta { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-dim); margin-top: 1rem; }
       .vacancy-badge { background: rgba(34, 197, 94, 0.1); color: var(--success); padding: 0.2rem 0.6rem; border-radius: 4px; font-weight: 600; }

        /* Event View & Seating */
       .back-btn { margin-bottom: 1.5rem; display: inline-block; cursor: pointer; color: var(--accent-blue); }
       .details-layout { display: grid; grid-template-columns: 1fr 350px; gap: 3rem; }
       .seat-section { background: var(--card-bg); padding: 2rem; border-radius: 12px; border: 1px solid #334155; }
       .seat-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; margin: 2rem 0; }
       .seat { aspect-ratio: 1; background: #334155; border-radius: 4px; cursor: pointer; transition: 0.2s; }
       .seat.available:hover { background: #475569; transform: scale(1.1); }
       .seat.selected { background: var(--primary); box-shadow: 0 0 15px var(--primary); }
       .seat.occupied { background: #0f172a; cursor: not-allowed; opacity: 0.3; }
       .legend { display: flex; gap: 1.5rem; font-size: 0.8rem; color: var(--text-dim); justify-content: center; }
       .legend-item { display: flex; align-items: center; gap: 0.5rem; }
       .dot { width: 12px; height: 12px; border-radius: 2px; }

       .btn-primary { 
            width: 100%; padding: 1rem; background: var(--primary); color: var(--bg-dark); 
            border: none; border-radius: 8px; font-weight: 700; cursor: pointer; 
            margin-top: 1rem; transition: 0.3s;
        }
       .btn-primary:hover { opacity: 0.9; transform: scale(1.02); }

       .hidden { display: none; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">IITR EVENTS</div>
        <div id="nav-actions" class="hidden">
            <button class="nav-btn" onclick="showScreen('dashboard')">All Events</button>
            <button class="nav-btn" style="margin-left:1rem" onclick="location.reload()">Logout</button>
        </div>
    </nav>

    <div class="container" id="login-screen">
        <div class="login-card">
            <div class="logo" style="margin-bottom: 2rem; font-size: 2rem;">Welcome</div>
            <div class="input-group">
                <label>IITR Email ID</label>
                <input type="email" placeholder="roll_no@iitr.ac.in" id="email-input">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••">
            </div>
            <button class="btn-primary" onclick="handleLogin()">Sign In</button>
        </div>
    </div>

    <div class="container hidden" id="dashboard">
        <div class="header-section">
            <h1>Campus Discovery</h1>
            <p>Explore high-impact festivals, career conclaves, and sports meets at IIT Roorkee.</p>
        </div>
        <div class="event-grid" id="event-list">
            </div>
    </div>

    <div class="container hidden" id="event-view">
        <div class="back-btn" onclick="showScreen('dashboard')">← Back to Dashboard</div>
        <div class="details-layout">
            <div class="main-info">
                <div class="tag" id="detail-tag"></div>
                <h1 id="detail-title" style="font-size: 3rem; margin: 0.5rem 0;"></h1>
                <p id="detail-desc" style="font-size: 1.1rem; line-height: 1.6; color: var(--text-dim);"></p>
                
                <div style="margin-top: 2rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div style="background: #1e293b; padding: 1rem; border-radius: 8px;">
                        <div style="font-size: 0.8rem; color: var(--primary)">DATE</div>
                        <div id="detail-date" style="font-weight: 600"></div>
                    </div>
                    <div style="background: #1e293b; padding: 1rem; border-radius: 8px;">
                        <div style="font-size: 0.8rem; color: var(--primary)">VENUE</div>
                        <div id="detail-venue" style="font-weight: 600"></div>
                    </div>
                </div>
            </div>

            <div class="seat-section">
                <h3 style="margin-top: 0;">Reserve Your Seat</h3>
                <p style="font-size: 0.9rem; color: var(--text-dim);">Live Vacancy: <span id="vacancy-percent" style="color: var(--success); font-weight: 700;"></span></p>
                
                <div class="seat-grid" id="seat-map"></div>

                <div class="legend">
                    <div class="legend-item"><div class="dot" style="background: #334155"></div> Available</div>
                    <div class="legend-item"><div class="dot" style="background: #0f172a"></div> Occupied</div>
                    <div class="legend-item"><div class="dot" style="background: var(--primary)"></div> Selected</div>
                </div>

                <button class="btn-primary" onclick="confirmRSVP()">Confirm Participation</button>
            </div>
        </div>
    </div>

    <script>
        const events =;

        let selectedEvent = null;

        function showScreen(screenId) {
            document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
            window.scrollTo(0,0);
        }

        function handleLogin() {
            const email = document.getElementById('email-input').value;
            if (email.includes('@')) {
                showScreen('dashboard');
                document.getElementById('nav-actions').classList.remove('hidden');
                renderEvents();
            } else {
                alert("Please use a valid institutional email.");
            }
        }

        function renderEvents() {
            const list = document.getElementById('event-list');
            list.innerHTML = events.map(e => `
                <div class="event-card" onclick="viewEvent(${e.id})">
                    <div class="card-img">${e.icon}</div>
                    <div class="card-content">
                        <span class="tag">${e.tag}</span>
                        <div class="card-title">${e.title}</div>
                        <div style="font-size: 0.8rem; color: var(--text-dim)">${e.venue}</div>
                        <div class="card-meta">
                            <span>${e.date}</span>
                            <span class="vacancy-badge">${Math.floor(Math.random() * 40 + 10)}% Available</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function viewEvent(id) {
            selectedEvent = events.find(e => e.id === id);
            showScreen('event-view');
            document.getElementById('detail-tag').innerText = selectedEvent.tag;
            document.getElementById('detail-title').innerText = selectedEvent.title;
            document.getElementById('detail-desc').innerText = selectedEvent.desc;
            document.getElementById('detail-date').innerText = selectedEvent.date;
            document.getElementById('detail-venue').innerText = selectedEvent.venue;
            renderSeats();
        }

        function renderSeats() {
            const map = document.getElementById('seat-map');
            map.innerHTML = '';
            for (let i = 0; i < 50; i++) {
                const seat = document.createElement('div');
                const isOccupied = Math.random() > 0.7;
                seat.className = `seat ${isOccupied? 'occupied' : 'available'}`;
                if (!isOccupied) {
                    seat.onclick = function() {
                        this.classList.toggle('selected');
                        updateVacancy();
                    };
                }
                map.appendChild(seat);
            }
            updateVacancy();
        }

        function updateVacancy() {
            const total = 50;
            const taken = document.querySelectorAll('.seat.occupied').length;
            const currentSelected = document.querySelectorAll('.seat.selected').length;
            const vacancy = (((total - (taken + currentSelected)) / total) * 100).toFixed(1);
            document.getElementById('vacancy-percent').innerText = vacancy + "%";
        }

        function confirmRSVP() {
            const count = document.querySelectorAll('.seat.selected').length;
            if (count > 0) {
                alert(`RSVP Confirmed for ${selectedEvent.title}!\nYour digital pass has been sent to your IITR Email.`);
                showScreen('dashboard');
            } else {
                alert("Please select at least one seat to confirm registration.");
            }
        }
    </script>
</body>
</html>
